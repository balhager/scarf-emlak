<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SCARF EMLAK</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@500&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap');

    :root {
      --highlight: #ffd700;
      --text-color: #ffffff;
      --input-bg: rgba(38, 38, 38, 0.6);
      --input-border: #3d3d3d;
      --result-bg: rgba(17, 17, 17, 0.6);
    }

    body {
      font-family: 'Raleway', sans-serif;
      background: url('https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    .header {
      background-color: transparent;
      padding: 80px 20px 40px 20px;
      text-align: center;
    }

    .header-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 4.5em;
      font-weight: 800;
      color: var(--highlight);
      text-shadow: 2px 2px 12px rgba(0, 0, 0, 0.7);
      letter-spacing: 3px;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 1.4em;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    .input-wrapper input[type="text"] {
      width: 100%;
      padding: 16px 60px 16px 20px;
      font-size: 20px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: #fff;
      outline: none;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    .input-wrapper::after {
      content: "$";
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--highlight);
      font-size: 30px;
      pointer-events: none;
    }

    input[type="range"] {
      width: 100%;
      margin-bottom: 20px;
    }

    .result {
      background-color: var(--result-bg);
      padding: 24px;
      border-radius: 12px;
      margin-top: 30px;
      box-shadow: inset 0 0 12px rgba(255,255,255,0.05);
    }

    .result p {
      margin: 16px 0;
      font-size: 1.4em;
      font-weight: 600;
    }

    .highlight {
      color: var(--highlight);
      font-family: 'Inter', sans-serif;
      font-size: 1.2em;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">SCARF EMLAK</div>
  </div>
  <div class="container">
    <label for="toplamPara">Alınan Kara Para:</label>
    <div class="input-wrapper">
      <input type="text" id="toplamPara" placeholder="Örn: 1,000,000" />
    </div>

    <label for="oran">Anlaşılan Yüzde: <span class="highlight" id="oranYazi">75%</span></label>
    <input type="range" id="oran" min="70" max="80" value="75" />

    <div class="result">
      <p>Karşı Tarafa Verilecek: <span class="highlight" id="karsiSonuc">$0</span></p>
      <p>Bize Kalan: <span class="highlight" id="bizSonuc">$0</span></p>
    </div>
  </div>

  <script>
    const toplamParaInput = document.getElementById("toplamPara");
    const oranSlider = document.getElementById("oran");
    const oranYazi = document.getElementById("oranYazi");
    const karsiSonuc = document.getElementById("karsiSonuc");
    const bizSonuc = document.getElementById("bizSonuc");

    function formatUSD(value) {
      return "$" + parseFloat(value).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatInputNumber(value) {
      const numeric = parseFloat(value.replace(/[^\d]/g, ''));
      if (isNaN(numeric)) return "";
      return numeric.toLocaleString('en-US');
    }

    function hesapla() {
      const rawValue = toplamParaInput.value.replace(/[^\d.]/g, '');
      const toplam = parseFloat(rawValue);
      const oran = parseInt(oranSlider.value);
      const bizeOran = 100 - oran;

      if (isNaN(toplam) || toplam <= 0) {
        karsiSonuc.textContent = "$0";
        bizSonuc.textContent = "$0";
        return;
      }

      toplamParaInput.value = formatInputNumber(toplam.toString());

      const karsi = toplam * (oran / 100);
      const biz = toplam * (bizeOran / 100);

      karsiSonuc.textContent = formatUSD(karsi);
      bizSonuc.textContent = formatUSD(biz);
    }

    toplamParaInput.addEventListener("input", hesapla);
    oranSlider.addEventListener("input", () => {
      oranYazi.textContent = oranSlider.value + "%";
      hesapla();
    });

    hesapla();
  </script>
</body>
</html>
